<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="A short survey.">

  <title>here we are</title>

  <link rel="icon" type="image/svg+xml" href="eye.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <noscript><p style="padding:26px">this page needs javascript.</p></noscript>

  <!-- Background gif layer (see BACKGROUND_GIF in script.js). Empty and invisible until you set one. -->
  <div id="bg" aria-hidden="true"></div>

  <!-- 1. intro: text on top (typed out), the eye below it fades in closed, then opens -->
  <section id="intro" class="screen on" aria-label="Introduction">
    <div class="center">
      <div class="intro-stack">

        <div id="msg" class="intro-line">
          <span class="line-wrap">
            <span id="msgGhost" class="ghost" aria-hidden="true"></span>
            <span class="typed" aria-hidden="true"><span id="msgText"></span></span>
          </span>
        </div>
        <div id="introSr" class="sr" role="status" aria-live="polite"></div>

        <div id="eye" class="eye" aria-hidden="true">
          <!-- frame 1: closed -->
          <svg class="eye-frame eye-closed" viewBox="0 0 64 64">
            <path d="M6 32S16 50 32 50s26-18 26-18M13 41l-4 6M32 50v8M51 41l4 6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <!-- frame 2: open (same drawing as eye.svg) -->
          <svg class="eye-frame eye-open" viewBox="0 0 64 64">
            <path d="M6 32S16 14 32 14s26 18 26 18-10 18-26 18S6 32 6 32Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="5"/>
          </svg>
        </div>

      </div>
    </div>
  </section>

  <!-- 2. disclaimer -->
  <section id="disclaimer" class="screen" aria-label="Disclaimer">
    <div class="wrap">
      <p id="disclaimerText" class="disclaimer"></p>
      <p id="disclaimerNote" class="dim"></p>
      <p><button id="agree" type="button">Agree</button></p>
    </div>
  </section>

  <!-- 3. survey -->
  <section id="survey" class="screen" aria-label="Survey">
    <div class="wrap">
      <div id="progress" class="dim"></div>
      <div id="qblock">
        <h2 id="prompt"></h2>
        <div id="answerArea"></div>
        <div id="hint" class="dim" role="status" aria-live="polite"></div>
        <div id="reply" class="reply" aria-live="polite" hidden></div>
        <p class="actions">
          <button id="go" type="button">Enter</button>
          <button id="next" type="button" hidden>Continue</button>
        </p>
      </div>
    </div>
  </section>

  <!-- 4. end -->
  <section id="end" class="screen" aria-label="Finished">
    <div class="center">
      <div>
        <div id="endText" class="big"></div>
        <p id="endLink" class="dim" hidden><a id="archiveLink" href="#">[ open the archive ]</a></p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
